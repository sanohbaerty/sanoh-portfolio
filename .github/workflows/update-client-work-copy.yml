name: Update client work copy

on:
  push:
    paths:
      - ".github/workflows/update-client-work-copy.yml"

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update portfolio copy
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("client/src/pages/Home.tsx")
          text = path.read_text()
          old = "Two completed commissions. Project details stay private."
          new = "Some work I've done for clients. Project details stay private."

          if old not in text:
              raise SystemExit("Expected text was not found")

          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/Home.tsx
          git commit -m "Update client work copy"
          git push

# trigger
